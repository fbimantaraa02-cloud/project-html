<html>
    <head>
        <title>
            Praktek form
        </title>
        </head>
        <body>
            <h2>Form Pendaftaran SPMP</h2>
            <form>
                <table>
                    <tr>
                        <td><label>Nama Lengkap</label></td>
                        <td>:</td>
                        <td><input type="text" required placeholder="masukan Nama"><br></td>
                    </tr>
                    <tr>
                        <td><label>No HP</label></td>
                        <td>:</td>
                        <td><input type="Number"></td>
                    </tr>
                    <tr>
                        <td><label>Tanggal Lahir</label></td>
                        <td>:</td>
                        <td><input type="date"></td>
                    </tr>
                    <tr>
                        <td><label>EMAILL</label></td>
                        <td>:</td>
                        <td><input type="email"></td>
                    </tr>
                    <tr>
                        <td><label>PAASWORD</label></td>
                        <td>:</td>
                        <td><input type="password"></td>
                    </tr>
                </table>
                               
                
                <label>Jenis Kelamin</label>
                <input type="radio" name="jeniskelamin" value="L">Laki-Laki
                <input type="radio" name="jeniskelamin" value="P">Perempuan<br>
                <br>                
                <label>HOBI</label><br>
                <br>
                <input type="checkbox" name=hobi value="">FUTSAL<br>
                <input type="checkbox" name=hobi value="">VOLLY<br>
                <input type="checkbox" name=hobi value="">BASKET<br>
                <input type="checkbox" name=hobi value="">BADMINTON<br>
                <input type="checkbox" name=hobi value="">BERKUDA<br>
                <input type="checkbox" name=hobi value="">NARI<br>
                <label>Jurusan</label>
                <select name="jurusan">
                    <option value="">pilih jur</option>
                    <option value="rpl">TKJ</option>
                    <option value="rpl">RPL</option>
                    <option value="rpl">PG</option>
                </select><br>
                <label>Alamat</label>
                <textarea placeholder="Alamat"></textarea><br>
                <label>Upload Foto</label>
                <input type="file"><br>

                <button type="submit">kirim</button>

            </form>
        </body>
</html>
